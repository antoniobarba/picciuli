# Workspace root. This file is not a package: it only declares the uv workspace
# and holds tool configuration shared by every package in the monorepo.

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
picciuli = { workspace = true }
picciuli-api = { workspace = true }

[dependency-groups]
dev = ["picciuli[dev,docs]", "picciuli-api[dev]"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["packages/picciuli/src", "apps/api/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = ["D105", "D107", "RUF036"]
# Typographic minus sign used in docstrings.
allowed-confusables = ["−"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]
"**/api_tests/**" = ["D"]

[tool.mypy]
python_version = "3.10"
strict = true
files = [
    "packages/picciuli/src",
    "packages/picciuli/tests",
    "apps/api/src",
    "apps/api/api_tests",
]
mypy_path = [
    "packages/picciuli/src",
    "packages/picciuli",
    "apps/api/src",
    "apps/api",
]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = [
    "packages/picciuli/src",
    "packages/picciuli/tests",
    "apps/api/src",
    "apps/api/api_tests",
]
addopts = "-ra --strict-markers --doctest-modules"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["picciuli", "picciuli_api"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
