# Production stack: Caddy (HTTPS) -> Picciuli API + web front-end + Zitadel
# (identity) -> Postgres.
# Lives in /opt/picciuli on the server next to Caddyfile, deploy.sh, backup.sh
# and .env (copied from .env.example), all owned by root. Deployments install
# them through /usr/local/sbin/picciuli-deploy; by hand: sudo ./deploy.sh.
#
# Hardening: every service drops all Linux capabilities except the ones it
# needs, cannot gain privileges (setuid binaries), and has memory, CPU and
# process limits sized well above its normal use, so that one runaway service
# cannot starve the others. Images are pinned by the digest of their
# multi-platform index; Dependabot proposes updates.
name: picciuli

x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  caddy:
    <<: *hardening
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    cpus: 1
    pids_limit: 256
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?set AUTH_DOMAIN in .env}
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      WEB_REDIRECT_DOMAINS: ${WEB_REDIRECT_DOMAINS:-}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      web:
        # Fixed address: the API trusts X-Forwarded-For only from Caddy.
        ipv4_address: 172.30.0.10

  api:
    <<: *hardening
    image: ghcr.io/antoniobarba/picciuli-api:${API_TAG:-latest}
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      PICCIULI_OIDC_ISSUER: https://${AUTH_DOMAIN}
      # Until the Zitadel project exists every token is rejected.
      PICCIULI_OIDC_AUDIENCE: ${OIDC_AUDIENCE:-not-configured}
      PICCIULI_OIDC_SWAGGER_CLIENT_ID: ${SWAGGER_CLIENT_ID:-}
      PICCIULI_OIDC_SWAGGER_SCOPES: ${SWAGGER_SCOPES:-openid profile email}
      PICCIULI_CORS_ORIGINS: ${CORS_ORIGINS:-}
      PICCIULI_PRICE_CACHE_SECONDS: ${PRICE_CACHE_SECONDS:-900}
      PICCIULI_LOGIN_ORIGIN: ${LOGIN_ORIGIN:-}
      PICCIULI_LOGIN_CLIENT_ID: ${WEB_CLIENT_ID:-}
      PICCIULI_LOGIN_ORG_ID: ${LOGIN_ORG_ID:-}
      PICCIULI_LOGIN_TOKEN_FILE: /run/secrets/login-client.pat
      PICCIULI_LOGIN_COOKIE_SECRET: ${PICCIULI_LOGIN_COOKIE_SECRET:-}
      # Swagger UI, ReDoc and /openapi.json stay off in production unless
      # DOCS_ENABLED=true is set in .env.
      PICCIULI_DOCS_ENABLED: ${DOCS_ENABLED:-false}
      # The API port is not published: only Caddy (at its fixed address) may
      # set X-Forwarded-For, which the login rate limiter keys on.
      PICCIULI_FORWARDED_ALLOW_IPS: 172.30.0.10
    volumes:
      - ./data/picciuli:/data
      - ./secrets:/run/secrets:ro
    networks: [web]

  web:
    <<: *hardening
    image: ghcr.io/antoniobarba/picciuli-web:${WEB_TAG:-latest}
    # The Caddy binary carries the file capability cap_net_bind_service: it
    # must stay in the bounding set for the binary to start (the non-root
    # user never actually gets it, because of no-new-privileges).
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    environment:
      # Read by the browser from /config.json.
      PICCIULI_API_URL: https://${API_DOMAIN}
      PICCIULI_OIDC_ISSUER: https://${AUTH_DOMAIN}
      PICCIULI_OIDC_CLIENT_ID: ${WEB_CLIENT_ID:-}
      PICCIULI_OIDC_PROJECT_ID: ${OIDC_AUDIENCE:-}
      PICCIULI_NATIVE_LOGIN: ${NATIVE_LOGIN:-false}
    read_only: true
    tmpfs: [/tmp]
    networks: [web]

  zitadel-api:
    <<: *hardening
    image: ghcr.io/zitadel/zitadel:v4.20.3@sha256:1b30fea7ed88826dc0a98dacee4e2f2c8b05201fd26f5e4cb5386615b29f7638
    # The image's "zitadel" user; it owns the zitadel-bootstrap volume.
    user: "1000:1000"
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    # The master key comes from the environment, not from the command line
    # (which every local user could read with ps).
    command: start-from-init --masterkeyFromEnv
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?set ZITADEL_MASTERKEY in .env}
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: ${AUTH_DOMAIN}
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/zitadel?sslmode=disable
      # The FIRSTINSTANCE settings only apply to the very first start.
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ${ZITADEL_ORG_NAME:-Picciuli}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME:-admin}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?set ZITADEL_ADMIN_PASSWORD in .env}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      # Rotate the PAT before it expires: see docs/deployment.md.
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${LOGIN_CLIENT_PAT_EXPIRATION:?set LOGIN_CLIENT_PAT_EXPIRATION in .env}
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://${AUTH_DOMAIN}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://${AUTH_DOMAIN}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://${AUTH_DOMAIN}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: https://${AUTH_DOMAIN}/ui/v2/login/login?samlRequest=
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    networks: [web, db]
    depends_on:
      postgres:
        condition: service_healthy

  zitadel-login:
    <<: *hardening
    # Runs as the image's own non-root user (nextjs).
    image: ghcr.io/zitadel/zitadel-login:v4.20.3@sha256:8f730428dfd65cd8979d07ef4e34a59d44978e956692b7dbbc3bba4e4abb4f92
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: ${LOGIN_SESSION_COOKIE_SECRET:?set LOGIN_SESSION_COOKIE_SECRET in .env}
      CUSTOM_REQUEST_HEADERS: Host:${AUTH_DOMAIN},X-Forwarded-Proto:https
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    networks: [web]
    depends_on:
      zitadel-api:
        condition: service_healthy

  postgres:
    <<: *hardening
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    # The entrypoint starts as root, fixes the data directory's owner and
    # switches to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zitadel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d zitadel -U postgres"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 20s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [db]

networks:
  web:
    ipam:
      config:
        # Containers get addresses from ip_range; Caddy's fixed one is outside it.
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
          gateway: 172.30.0.1
  db:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  zitadel-bootstrap:
