name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - run: pip install -e "packages/picciuli[dev]" -e apps/tui -e "apps/api[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Production runtime, minimum supported library runtime, and Windows.
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - run: pip install -e "packages/picciuli[dev]" -e apps/tui
      # The API server (FastAPI) needs Python 3.11 or newer.
      - if: matrix.python-version != '3.10'
        run: pip install -e "apps/api[dev]"
      - if: matrix.python-version != '3.10'
        run: pytest --cov
      - if: matrix.python-version == '3.10'
        run: pytest packages/picciuli apps/tui --cov=picciuli --cov=picciuli_tui

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # The typed client must match the committed OpenAPI schema of the API.
      - run: npm run check-api-types
      - run: npm run lint
      - run: npm test
      # build includes the TypeScript check (tsc -b).
      - run: npm run build

  docker:
    # Master is built again by Deploy; keep image smoke tests at the PR gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: picciuli-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 \
            -e PICCIULI_OIDC_ISSUER=https://auth.example.com \
            -e PICCIULI_OIDC_AUDIENCE=ci picciuli-api:ci
          curl --fail --retry 10 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:8000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8000/api/v1/accounts)" = 401
          docker rm -f api
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: picciuli-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Smoke test the web image
        run: |
          docker run -d --name web --read-only --tmpfs /tmp -p 8080:8080 \
            -e PICCIULI_API_URL=https://api.example.com \
            -e PICCIULI_OIDC_ISSUER=https://auth.example.com \
            -e PICCIULI_OIDC_CLIENT_ID=client -e PICCIULI_OIDC_PROJECT_ID=project \
            picciuli-web:ci
          curl --fail --retry 10 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:8080/healthz
          curl --fail -s http://127.0.0.1:8080/config.json | grep -q '"oidcClientId":"client"'
          curl --fail -s http://127.0.0.1:8080/accounts | grep -q '<div id="root">'
          docker rm -f web

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - run: pip install -e "packages/picciuli[docs]"
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: site

  deploy-docs:
    needs: [lint, test, web, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
