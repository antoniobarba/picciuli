site_name: Picciuli
site_description: Personal budgeting and money tracking engine
repo_url: https://github.com/antoniobarba/picciuli
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Console interface: tui.md
  - Web and mobile app: web.md
  - API server: api-server.md
  - Deployment: deployment.md
  - Development: development.md
  - API reference:
      - Book: api/book.md
      - Services: api/services.md
      - Model: api/model.md
      - Price providers: api/prices.md
      - Exchange-rate providers: api/rates.md
      - Money helpers: api/money.md
      - Errors: api/errors.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/picciuli/src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true
