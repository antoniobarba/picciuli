[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "picciuli-tui"
version = "2.0.0.dev0"
description = "Console user interface for Picciuli, the personal budgeting and money tracking engine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Antonio Barba" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Typing :: Typed",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = ["picciuli==2.0.0.dev0", "textual>=8.0,<9"]

[project.optional-dependencies]
dev = ["picciuli[dev]"]

[project.scripts]
picciuli-tui = "picciuli_tui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/picciuli_tui"]
